<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesignBudget</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="navbar">⚙️ DesignBudget</div>

    <div class="container">

        <h2 class="titulo">Serviços</h2>

        <div class="card">HTML <span>R$ 30,00/h</span></div>
        <div class="card">CSS <span>R$ 50,00/h</span></div>
        <div class="card">JavaScript <span>R$ 40,00/h</span></div>

        <h2 class="titulo">Novo Trabalho</h2>

        <div class="formulario">
            <label>Empresa:</label>
            <input type="text" id="empresa" placeholder="Nome da empresa">

            <label>Serviço:</label>
            <select id="servico">
                <option value="">Selecione...</option>
                <option value="HTML">HTML — R$ 30/h</option>
                <option value="CSS">CSS — R$ 50/h</option>
                <option value="JavaScript">JavaScript — R$ 40/h</option>
            </select>

            <label>Horas:</label>
            <input type="number" id="horas" placeholder="Ex: 10" inputmode="decimal">

            <label>Imposto (%):</label>
            <input type="number" id="imposto" value="15" inputmode="decimal">

            <label>Desconto (%):</label>
            <input type="number" id="desconto" value="0" inputmode="decimal">

            <label>Urgência:</label>
            <select id="urgencia">
                <option value="0">Sem urgência</option>
                <option value="20">Com urgência (+20%)</option>
                <option value="50">Muita urgência (+50%)</option>
            </select>

            <label>Prazo:</label>
            <input type="date" id="prazo">

            <button class="btn" onclick="adicionar()">Adicionar</button>
            <button class="btn-reset" onclick="resetar()">Resetar</button>
        </div>

        <h2 class="titulo">Tarefas</h2>
        <div id="lista"></div>

    </div>

    <footer>@2026 Todos os direitos reservados</footer>

    <script src="script.js"></script>
</body>

</html>
